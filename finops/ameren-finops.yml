description: >-
  FinOps scaffold for Ameren. The Share My Usage / Green Button program is a regulator-driven data-sharing service rather than a commercial API; access is granted under the Illinois Commerce Commission framework with no documented metered billing. FOCUS mappings remain conceptual.
notes: >-
  Ameren Illinois operates the Share My Usage / Green Button Connect My Data program (operated by data custodian Aclara) under the ESPI standard. Access for authorized third parties is governed by a registration and testing process rather than a metered, priced API. Rate limits are not publicly published; the program documents a 2-4 week onboarding and 24-month rolling data window. Reconcile if Ameren or Aclara publishes specific rate-limit or pricing values.
