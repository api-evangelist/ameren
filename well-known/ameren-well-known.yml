method: probed
source: live GET probes of /.well-known/* on every apis.yml host, the docs host, and the
  Ameren identity host discovered from the Renewables Portal page
provider: Ameren
providerId: ameren
note: >-
  Two real documents were served. (1) An RFC 9116 security.txt is published on every
  reachable Ameren web host (www, anm, gp); on www.ameren.com the /.well-known/ path 302s
  to https://www.ameren.com/-/media/security.txt, which returns the document as
  text/plain. It is PAST ITS OWN Expires date (2026-08-09) as of this probe. (2) A live,
  anonymous OpenID Connect discovery document is served by Ameren's ForgeRock AM identity
  service at https://login.eiam.ece.ameren.com/am/oauth2/.well-known/openid-configuration
  — note the non-standard AM-prefixed path; the RFC 8414 root path /.well-known/openid-configuration
  404s on that host. CAUTION recorded honestly: the discovery document advertises its
  issuer and every endpoint on https://global.login.eiam.ameren.com/, a hostname that does
  NOT resolve from the public internet (curl exit 6 / no DNS answer), so the advertised
  endpoints are not publicly reachable even though the discovery document is.
  Every other probed path missed. anm.ameren.com and gp.ameren.com are Angular SPAs behind
  an Imperva bot challenge that answer HTTP 200 with an HTML shell ("Pardon Our
  Interruption") for EVERY path including /.well-known/notexist-xyz — a control probe was
  run to confirm this, so their 200s are recorded as misses, not documents.
