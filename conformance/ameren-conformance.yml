description: >-
  Cross-cutting and domain standard conformance for Ameren. There is no OpenAPI to read, so
  every assertion below is anchored either in the live OIDC discovery document Ameren's
  identity service serves or in Ameren Illinois' own program documentation. Nothing here is
  inferred from category.
standards:
