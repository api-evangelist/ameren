    name: OAuth 2.0 (RFC 6749)
    conforms: true
    evidence:
      source: https://login.eiam.ece.ameren.com/am/oauth2/.well-known/openid-configuration
      location: grant_types_supported, authorization_endpoint, token_endpoint
      detail: >-
        authorization_code, client_credentials, refresh_token, password, implicit and
        device_code grants advertised with authorize and access_token endpoints.
  - id: oidc
    name: OpenID Connect Core 1.0 + Discovery 1.0
    conforms: true
    evidence:
      source: https://login.eiam.ece.ameren.com/am/oauth2/.well-known/openid-configuration
      location: issuer, jwks_uri, userinfo_endpoint, id_token_signing_alg_values_supported
      detail: >-
        A complete OIDC discovery document is served anonymously. Note it is at the
        ForgeRock AM path /am/oauth2/.well-known/openid-configuration; the RFC 8414 root
        path 404s, so an out-of-the-box RFC 8414 client will not find it.
