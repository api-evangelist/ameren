domain_standards:
  - id: espi-green-button
    name: NAESB Energy Services Provider Interface (ESPI) / Green Button Connect My Data
    market: Regulated electric utility customer energy usage data
    conforms: true
    declared_in: documentation
    contract_declared: false
    evidence:
      source: https://www.ameren.com/partners/account-and-data/share-my-usage
      status: 200
      detail: >-
        Ameren Illinois states the program is "based on the common technical standards
        developed with the support of the Commerce Department's National Institute of
        Standards and Technology (NIST), released by the North American Energy Standards
        Board (NAESB)", that ESPI "consists of a common XML format for energy usage
        information and a data exchange protocol", and that its technical requirements are
        "consistent with those defined in the standard Green Button Connect Application
        Programming Interfaces (API)".
    caveat: >-
      REWARD-ONLY AND HONESTLY QUALIFIED: this is a prose claim on a program page, not a
      standard declared inside a machine-readable contract. Ameren publishes no ESPI
      ApplicationInformation resource, no Atom/XML schema and no endpoint list publicly.
      The canonical Green Button DataCustodian resource path was probed on gp.ameren.com
      and returned the site's HTML bot-challenge page. A third party learns the actual ESPI
      surface from Aclara during registration.
  - id: green-button-alliance-certification
    name: Green Button Alliance certification
    conforms: unknown
    evidence:
      detail: >-
        Ameren Illinois participates in the Green Button initiative, but no Green Button
        Alliance certification mark or certificate number was found on any Ameren page.
        Not asserted.
compliance_certifications: []
compliance_note: >-
  No trust center, SOC 2, ISO 27001, PCI, HIPAA or FedRAMP certification page was found on
  ameren.com. probe-security-programs.py returned trust=none. As a regulated utility Ameren
  is subject to NERC CIP, but nothing is published as a customer-facing compliance program,
  so no Compliance pointer is emitted.
