description: >-
  Ameren and its data custodian Aclara publish no rate limits, no quotas, no burst
  allowances and no rate-limit response headers for the Share My Usage / Green Button
  Connect My Data program. No developer reference exists in which limits could be stated.
  This is an honest zero: searched, nothing published.
limit_count: 0
limits: []
headers: []
headers_note: >-
  No X-RateLimit-*, RateLimit-* or Retry-After behaviour is documented, and none could be
  observed live — there is no anonymously callable endpoint on which to observe a response.
  Nothing is asserted.
response_codes:
  throttled: null
  service_unavailable: null
  note: >-
    The prior version of this file asserted 429 and 503. Ameren documents neither; those
    values were a scaffold default and have been removed rather than left standing as a
    claim about Ameren's behaviour.
searched:
  - url: https://www.ameren.com/partners/account-and-data/share-my-usage
    status: 200
    finding: No throughput, concurrency or quota figures. Documents onboarding time and data window only.
  - url: https://gp.ameren.com/third-party-registration/instructions
    status: 200
    finding: Angular SPA behind an Imperva bot challenge; nothing readable anonymously.
documented_constraints:
  - name: Data window
    detail: Up to 24 months historical plus 24 months forward electric usage data per authorized customer.
    source: https://www.ameren.com/partners/account-and-data/share-my-usage
    note: A data-scope limit, not a rate limit. Recorded here so it is not mistaken for one.
  - name: Onboarding time
    detail: 2 to 4 weeks for third-party registration and technical verification with Aclara.
    source: https://www.ameren.com/partners/account-and-data/share-my-usage
  - name: Territory
    detail: Illinois only; Share My Usage is not available for Missouri customers.
    source: https://www.ameren.com/partners/account-and-data/share-my-usage
note: >-
  Supersedes the 2026-05-04 bulk-sweep scaffold, which carried one fabricated limits[] row
  ("see partner agreement") and scaffold-default 429/503 codes. Replaced with a probed zero.
