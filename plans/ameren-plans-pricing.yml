description: >-
  Ameren publishes no plans, no tiers and no price list for its Share My Usage / Green
  Button Connect My Data program, and no pricing page exists for any third-party data
  interface. Access is granted through a registration and review process operated with
  data custodian Aclara, under the Illinois Commerce Commission tariff framework, not sold
  as a product. This is an honest zero: searched, nothing to record.
