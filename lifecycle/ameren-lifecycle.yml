program_lifecycle:
  - stage: Third-party registration
    detail: >-
      Two-phase application: Ameren Illinois reviews, then data custodian Aclara collects
      technical information. Ameren states the whole process takes 2 to 4 weeks.
    url: https://gp.ameren.com/third-party-registration/instructions
  - stage: Registration term
    detail: Ameren states registration does not expire once approved; it remains active unless discontinued.
  - stage: Customer authorization term
    detail: >-
      Up to 24 months of historical usage data plus 24 months of forward data, unless the
      customer revokes authorization before the 24-month expiration.
  - stage: Revocation
    detail: Customer-initiated at any time within the term. See conventions/ameren-conventions.yml reversibility.
  - stage: Territory boundary
    detail: >-
      Illinois only. Ameren states Share My Usage is not currently available for Missouri
      customers — a live scope limit an integrator must plan around.
